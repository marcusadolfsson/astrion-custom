# Astrion remote - layout for the custom app (com.custom.astrion).
#
# THIS FILE IS THE SOURCE OF TRUTH. The app fetches it as JSON from
# /api/astrion_dashboard (custom_components/astrion_dashboard converts it), so
# there is no generated .json to keep in sync - just edit here, then press Sync
# on the remote (swipe up).
#
# Conventions worth knowing:
#   startPage      index of the page shown at launch
#   separator      a section header; its name is ALSO the anchor that a hotkey
#                  scroll_to jumps to, so renaming one means updating hotkeys
#   bubble_select  pill + dropdown; active_entity supplies the shown value, and
#                  each option's active_value must match that entity's state
#                  string EXACTLY (e.g. "Watch Apple TV", not "Apple TV")
#   open_on        section name whose hotkey should also pop this dropdown open
#                  (used where a section holds a single selector)
#   conditional    shows its child card(s) only while entity_id == state
#   monitor rows   optional "attribute" reads that attribute, not the state
#   hotkeys        physical buttons: page and/or scroll_to and/or service, or
#                  action: sync. Key names come from HardwareKeys.kt.
#
startPage: 0
pages:
- name: Living Room
  # ---------------------------------------------------------------------------
  # DOCK VIEW. Replaces `cards:` while the remote is ON POWER. Two columns of
  # ~165dp buttons on a ~349dp panel (480x800 @ density 220) -- sized to be hit
  # without looking, from across the room, which is the whole point of the dock.
  #
  # Swiping left/right still changes ROOM: this is a per-page card list, not a
  # dock page, so the pager and `startPage` are untouched.
  #
  # Every service below is copied from a control already on this page, so the
  # dock view fires exactly what the in-hand view fires.
  # ---------------------------------------------------------------------------
  dock_cards:
  # The SAME now-playing strip the in-hand page uses -- launcher and all.
  # `dock_index_only` keeps it off the submenus, which need that height.
  - type: conditional
    options:
      # Two gates, outer first: the SOURCE must not be Off. A player can sit in
      # a stale 'paused' long after the system is down, and a now-playing row
      # for a dark room is worse than none.
      entity_id: input_select.lr_av_activity
      state_not: 'Off'
      dock_index_only: true
      card:
        type: conditional
        options:
          # ...and the player must actually have something on. The strip says
          # "Nothing playing" rather than vanishing, which is right on the
          # in-hand page and wrong on a dock that is otherwise all live status.
          entity_id: media_player.living_room_apple_tv
          state_in: ['playing', 'paused']
          card:
            type: media_player
            options:
              entity_id: media_player.living_room_apple_tv
              variant: strip
              art_size: 56
              button_size: 60
              # The launcher lives here now rather than on the Activity row: it
              # belongs with what is playing, and this row is already about the
              # Apple TV. target_from still points it at the latched multi-view pane.
              launcher:
                icon: apps
                name: Apple TV
                columns: 3
                item_height: 64
                item_font_size: 12
                target_from: sensor.lr_key_target_media_player
                items: !include atv_items_lr.yaml
  - type: conditional
    options:
      # Two gates, outer first: the SOURCE must not be Off. A player can sit in
      # a stale 'paused' long after the system is down, and a now-playing row
      # for a dark room is worse than none.
      entity_id: input_select.lr_av_activity
      state_not: 'Off'
      dock_index_only: true
      card:
        type: conditional
        options:
          # ...and the player must actually have something on. The strip says
          # "Nothing playing" rather than vanishing, which is right on the
          # in-hand page and wrong on a dock that is otherwise all live status.
          entity_id: media_player.kaleidescape_strato_e
          state_in: ['playing', 'paused']
          card:
            type: media_player
            options:
              entity_id: media_player.kaleidescape_strato_e
              variant: strip
              art_size: 56
              button_size: 60
              # The Kaleidescape's own launcher: the three browse views, the store,
              # the menu, then the whole library alphabetically. Tapping a title
              # plays it outright -- see script.kaleidescape_play_movie, and
              # scripts/kaleidescape_library.py for where the list comes from
              # (the server has no protocol enumeration, so it is scraped).
              #
              # 2 columns, not 3: these are long titles with years, not logos.
              launcher:
                icon: movie
                name: Kaleidescape
                # One per row: these are long titles with years, and 207 of them
                # read as a list. As tiles they read as 207 buttons.
                columns: 1
                item_height: 44
                item_font_size: 15
                items: !include kscape_items.yaml
              # CHAPTER skip, not scan. HA's kaleidescape integration whitelists
              # only 11 zero-arg commands and chapter skip is not among them --
              # scan_forward/scan_reverse are fast-forward/rewind. The real
              # NEXT/PREVIOUS are top-level protocol commands, reached through
              # scripts/kaleidescape_event.py (the same route the subtitle and
              # audio-track actions use). `scan: false` gives them skip icons and
              # stops them putting the card into its scanning state, which would
              # otherwise flip the centre button to Play after a chapter jump.
              reverse:
                service: shell_command.kaleidescape_event
                scan: false
                data:
                  event: PREVIOUS
              forward:
                service: shell_command.kaleidescape_event
                scan: false
                data:
                  event: NEXT
  - type: dock_menu
    options:
      columns: 2
      # Two sizes, because the now-playing strip is not always there.
      #
      # 150dp is the CEILING for the solo case, derived not guessed: the
      # LazyColumn is ~492dp tall (status bar to room-label strip) and carries
      # 8dp of contentPadding top and bottom, leaving 476dp; three tiles plus
      # two 10dp gaps means 3H + 20 <= 476, so H <= 152. 154 overflowed by 2dp,
      # which is why the page scrolled "just barely". 150 keeps a 6dp buffer.
      #
      # 114dp is the measured fit WITH the strip (grid ran to y=688, room label
      # at y=734). `compact_when` must mirror the conditional on the media card
      # above -- PageContent lays cards out in a LazyColumn, so this card cannot
      # measure its siblings and has to be told.
      button_height: 150
      button_height_compact: 106
      # ONE definition, shared with the card that draws the strip -- see
      # the note on binary_sensor.lr_dock_media_visible in templates.yaml. Keying
      # this on the activity alone is what left the index using short
      # tiles with no strip present.
      compact_when:
        entity_id: binary_sensor.lr_dock_media_visible
        state: 'on'
      menus:
      - name: Activity
        close_on_select: true
        icon: tv
        status_entity: input_select.lr_av_activity
        # TV wall lock, on the back row. The lock enforcer bounces any activity
        # chosen while this is on, so it belongs beside the activity buttons --
        # otherwise a locked wall looks like the buttons are broken.
        # Same three helpers the in-hand page's Watch separator uses, so the
        # dock lock IS that lock: one tap to lock, PIN keypad to unlock, and HA
        # (automation.tv_wall_validate_unlock_pin) does the comparing.
        lock:
          entity: input_boolean.tv_wall_locked
          pin_entry: input_text.tv_wall_lock_pin_entry
          pin_entity: input_text.tv_wall_lock_pin
        items:
        - {name: Apple TV, icon: tv, service: script.lr_av_watch_apple_tv, active_value: 'Watch Apple TV'}
        - {name: Kaleidescape, icon: movie, service: script.lr_av_watch_kaleidescape, active_value: 'Watch Kaleidescape'}
        - {name: Nintendo, icon: game, service: script.lr_av_play_switch, active_value: 'Play Switch'}
        - {name: 'Off', icon: power, service: script.lr_av_off, active_value: 'Off'}
        # Corner icons, in the back row beside the lock: these qualify WATCHING
        # rather than being things to watch. Order here is the order shown.
        - name: Brightness
          corner: true
          icon: brightness
          status_entity: input_select.novastar_brightness_preset
          items:
          - {name: Auto, icon: brightness-auto, service: script.novastar_brightness_auto, active_value: 'Auto'}
          - {name: Bright, icon: bright, service: script.novastar_brightness_bright, active_value: 'Bright'}
          - {name: Normal, icon: brightness, service: script.novastar_brightness_normal, active_value: 'Normal'}
          - {name: Dim, icon: dim, service: script.novastar_brightness_dim, active_value: 'Dim'}
        - name: Screen Size
          corner: true
          icon: screen
          status_entity: input_select.lr_screen_layout
          items:
          - {name: Full, icon: screen, service: script.lr_screen_full, active_value: 'Full'}
          - {name: Compact, icon: aspect, service: script.lr_screen_compact, active_value: 'Compact'}
          - {name: Multi, icon: apps, service: script.lr_screen_multi, active_value: 'Multi View'}
          - name: Source 2
            icon: source
            status_entity: input_select.lr_mv_source_2
            # Only meaningful in Multi View.
            visible_when: {entity_id: input_select.lr_screen_layout, state: 'Multi View'}
            # Top-right corner, like the lock: latching the remote's keys to
            # this pane is a property OF the pane, not a fifth source.
            action:
              icon: remote
              service: input_select.select_option
              entity_id: input_select.lr_key_target
              data: {option: 'Source 2'}
              active_entity: input_select.lr_key_target
              active_value: 'Source 2'
            items:
            - {name: 'Off', icon: power, service: input_select.select_option, entity_id: input_select.lr_mv_source_2, data: {option: 'Off'}, active_value: 'Off'}
            - {name: 'Apple TV 2', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_2, data: {option: 'ATV2'}, active_value: 'ATV2'}
            - {name: 'Apple TV 3', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_2, data: {option: 'ATV3'}, active_value: 'ATV3'}
            - {name: 'Kaleidescape', icon: movie, service: input_select.select_option, entity_id: input_select.lr_mv_source_2, data: {option: 'KScape'}, active_value: 'KScape'}
          - name: Source 3
            icon: source
            status_entity: input_select.lr_mv_source_3
            # Only meaningful in Multi View.
            visible_when: {entity_id: input_select.lr_screen_layout, state: 'Multi View'}
            # Top-right corner, like the lock: latching the remote's keys to
            # this pane is a property OF the pane, not a fifth source.
            action:
              icon: remote
              service: input_select.select_option
              entity_id: input_select.lr_key_target
              data: {option: 'Source 3'}
              active_entity: input_select.lr_key_target
              active_value: 'Source 3'
            items:
            - {name: 'Off', icon: power, service: input_select.select_option, entity_id: input_select.lr_mv_source_3, data: {option: 'Off'}, active_value: 'Off'}
            - {name: 'Apple TV 2', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_3, data: {option: 'ATV2'}, active_value: 'ATV2'}
            - {name: 'Apple TV 3', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_3, data: {option: 'ATV3'}, active_value: 'ATV3'}
            - {name: 'Kaleidescape', icon: movie, service: input_select.select_option, entity_id: input_select.lr_mv_source_3, data: {option: 'KScape'}, active_value: 'KScape'}
          - name: Source 4
            icon: source
            status_entity: input_select.lr_mv_source_4
            # Only meaningful in Multi View.
            visible_when: {entity_id: input_select.lr_screen_layout, state: 'Multi View'}
            # Top-right corner, like the lock: latching the remote's keys to
            # this pane is a property OF the pane, not a fifth source.
            action:
              icon: remote
              service: input_select.select_option
              entity_id: input_select.lr_key_target
              data: {option: 'Source 4'}
              active_entity: input_select.lr_key_target
              active_value: 'Source 4'
            items:
            - {name: 'Off', icon: power, service: input_select.select_option, entity_id: input_select.lr_mv_source_4, data: {option: 'Off'}, active_value: 'Off'}
            - {name: 'Apple TV 2', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_4, data: {option: 'ATV2'}, active_value: 'ATV2'}
            - {name: 'Apple TV 3', icon: tv, service: input_select.select_option, entity_id: input_select.lr_mv_source_4, data: {option: 'ATV3'}, active_value: 'ATV3'}
            - {name: 'Kaleidescape', icon: movie, service: input_select.select_option, entity_id: input_select.lr_mv_source_4, data: {option: 'KScape'}, active_value: 'KScape'}
      - name: Lights
        close_on_select: true
        icon: light
        status_entity: input_select.living_room_active_scene
        items:
        - {name: Bright, icon: bright, service: script.lr_lights_bright}
        - {name: Entertain, icon: entertain, service: script.lr_lights_entertain}
        - {name: Relax, icon: relax, service: script.lr_lights_relax}
        - {name: Movie, icon: movie, service: script.lr_lights_movie}
        - {name: 'Off', icon: power, service: script.lr_lights_off}
      # Acts on whatever input_select.lr_shade_target is set to (default
      # "All Shades"), the same as the in-hand shade control -- NOT a
      # separate all-shades path that could drift from it.
      - name: Shades
        icon: shade
        # status_entity is the TARGET, because the nested "Which shades" tile and
        # its highlight are driven from it. The INDEX wants something else --
        # whether the shades are actually open -- so it gets its own source, and
        # the name drops to the grey caption like every other tile.
        status_entity: input_select.lr_shade_target
        index_status:
          status_entity: sensor.lr_shade_summary
        items:
        - {name: Open, icon: open, service: script.lr_shade_target_open}
        - {name: Close, icon: close, service: script.lr_shade_target_close}
        - {name: Stop, icon: stop, service: script.lr_shade_target_stop}
        - name: Which shades
          icon: shade
          # Labelled with the CURRENT target rather than "Which shades", so the
          # tile answers the question instead of asking it. Choosing one closes
          # this level and returns to Shades, where Open/Close/Stop are waiting.
          status_entity: input_select.lr_shade_target
          close_on_select: true
          items:
          - {name: 'All Shades', icon: shades, service: input_select.select_option, entity_id: input_select.lr_shade_target, data: {option: 'All Shades'}, active_value: 'All Shades'}
          - {name: 'North', icon: north, service: input_select.select_option, entity_id: input_select.lr_shade_target, data: {option: 'North'}, active_value: 'North'}
          - {name: 'Left', icon: left, service: input_select.select_option, entity_id: input_select.lr_shade_target, data: {option: 'Left'}, active_value: 'Left'}
          - {name: 'Center', icon: center, service: input_select.select_option, entity_id: input_select.lr_shade_target, data: {option: 'Center'}, active_value: 'Center'}
          - {name: 'Right', icon: right, service: input_select.select_option, entity_id: input_select.lr_shade_target, data: {option: 'Right'}, active_value: 'Right'}
      - name: Climate
        icon: climate
        # Current temperature large, setpoints as coloured pills beneath:
        # BLUE is the cool setpoint, ORANGE the heat one. In Auto a
        # thermostat has both, so both are drawn. The single-mode entries
        # carry a `state` because they differ only by colour -- the same
        # number is blue when cooling and orange when heating. The Auto
        # pair needs no condition: low/high are null outside heat_cool and
        # an unresolvable pill is simply skipped.
        status_entity: climate.living_room
        status_big: "{current_temperature}\u00B0"
        status_pills:
        - {format: "{temperature}\u00B0", color: cool, state: cool}
        - {format: "{temperature}\u00B0", color: heat, state: heat}
        - {format: "{target_temp_low}\u00B0", color: heat}
        - {format: "{target_temp_high}\u00B0", color: cool}
        modes:
          entity_id: climate.living_room
          options:
          - {name: Cool, icon: cool, service: climate.set_hvac_mode, entity_id: climate.living_room, data: {hvac_mode: 'cool'}, active_value: 'cool'}
          - {name: Heat, icon: heat, service: climate.set_hvac_mode, entity_id: climate.living_room, data: {hvac_mode: 'heat'}, active_value: 'heat'}
          - {name: Auto, icon: auto-mode, service: climate.set_hvac_mode, entity_id: climate.living_room, data: {hvac_mode: 'heat_cool'}, active_value: 'heat_cool'}
          - {name: 'Off', icon: power, service: climate.set_hvac_mode, entity_id: climate.living_room, data: {hvac_mode: 'off'}, active_value: 'off'}
        # The in-hand page's own climate card, embedded: rollable temperature,
        # +/- steppers, both bounds in Auto, and the hold shown inline with its
        # clear button -- all of which a grid of fixed setpoints could not do.
        card:
          type: bubble_climate
          options:
            entity_id: climate.living_room
            step: 1
            # The picker IS the page here; a modal inside a page is a
            # second layer to dismiss for nothing.
            inline: true
            hold_entity: binary_sensor.living_room_holding
            clear_hold:
              service: button.press
              entity_id: button.living_room_clear_hold
        items: []
      - name: Fan
        close_on_select: true
        icon: fan
        status_entity: fan.living_room_ceiling_fan
        status_attribute: percentage
        status_from_items: true
        items:
        - {name: Fast, icon: speed-high, service: fan.set_percentage, entity_id: fan.living_room_ceiling_fan, data: {percentage: 100}}
        - {name: Medium, icon: speed-medium, service: fan.set_percentage, entity_id: fan.living_room_ceiling_fan, data: {percentage: 67}}
        - {name: Low, icon: speed-low, service: fan.set_percentage, entity_id: fan.living_room_ceiling_fan, data: {percentage: 33}}
        - {name: 'Off', icon: power, service: fan.turn_off, entity_id: fan.living_room_ceiling_fan}
  cards:
  - type: conditional
    options:
      entity_id: input_select.lr_av_activity
      state: Watch Apple TV
      # Sidebar lane on a multi-column device (the Pixel Tablet); READ ONLY when
      # ui.columns > 1, so the remotes ignore it entirely.
      column: 3
      cards:
      # A one-line status strip, not the full now-playing panel: on a 480x800
      # remote that panel pushed the Watch section off the screen for something
      # you only glance at. It also does NOT hide when idle -- this row is what
      # tells you the source is up at all, so it says "Nothing playing" instead
      # of vanishing.
      - type: media_player
        options:
          entity_id: media_player.living_room_apple_tv
          variant: strip
          art_size: 68
          # The launcher lives here now rather than on the Activity row: it
          # belongs with what is playing, and this row is already about the
          # Apple TV. target_from still points it at the latched multi-view pane.
          launcher:
            icon: apps
            name: Apple TV
            columns: 3
            item_height: 64
            item_font_size: 12
            target_from: sensor.lr_key_target_media_player
            items: !include atv_items_lr.yaml
  - type: conditional
    options:
      entity_id: input_select.lr_av_activity
      state: Watch Kaleidescape
      # Sidebar lane on a multi-column device (the Pixel Tablet); READ ONLY when
      # ui.columns > 1, so the remotes ignore it entirely.
      column: 3
      card:
        type: media_player
        options:
          entity_id: media_player.kaleidescape_strato_e
          variant: strip
          art_size: 68
          # The Kaleidescape's own launcher: the three browse views, the store,
          # the menu, then the whole library alphabetically. Tapping a title
          # plays it outright -- see script.kaleidescape_play_movie, and
          # scripts/kaleidescape_library.py for where the list comes from
          # (the server has no protocol enumeration, so it is scraped).
          #
          # 2 columns, not 3: these are long titles with years, not logos.
          launcher:
            icon: movie
            name: Kaleidescape
            # One per row: these are long titles with years, and 207 of them
            # read as a list. As tiles they read as 207 buttons.
            columns: 1
            item_height: 44
            item_font_size: 15
            items: !include kscape_items.yaml
          # CHAPTER skip, not scan. HA's kaleidescape integration whitelists
          # only 11 zero-arg commands and chapter skip is not among them --
          # scan_forward/scan_reverse are fast-forward/rewind. The real
          # NEXT/PREVIOUS are top-level protocol commands, reached through
          # scripts/kaleidescape_event.py (the same route the subtitle and
          # audio-track actions use). `scan: false` gives them skip icons and
          # stops them putting the card into its scanning state, which would
          # otherwise flip the centre button to Play after a chapter jump.
          reverse:
            service: shell_command.kaleidescape_event
            scan: false
            data:
              event: PREVIOUS
          forward:
            service: shell_command.kaleidescape_event
            scan: false
            data:
              event: NEXT
  # Kaleidescape Voice search results are NO LONGER here.
  #
  # They were: one card on this shared page, watching one shared entity, with
  # `open_when: 'on'`. So a search from any remote popped a full-screen movie
  # list on EVERY remote in the house at once.
  #
  # Now each device's override file carries its own copy pointing at its own
  # picker (media_player.kaleidescape_voice_search_<device>), and its own
  # `voice:` block whose path ends `?from=<device>`. That query string is what
  # kaleidescape_voice keys the results on -- see SEARCH_DEVICES in its const.py.
  #
  # It has to live in the overrides rather than here because `page_cards:` can
  # only prepend/append; there is no way to rewrite this card's entity_id per
  # device. Which also means there is deliberately NO card here: putting the
  # shared one back would show it on every device again, overrides included,
  # which is the exact bug this moved to fix. All four real devices have an
  # override file; only an unrecognised IP would get this page, and it simply
  # shows no search results.
  #
  # media_player.kaleidescape_voice_search (unsuffixed) still EXISTS -- the TV
  # Wall dashboard points at it, and it answers every search regardless of
  # origin. It just no longer has a card on any remote.
  - type: separator
    options:
      name: Watch
      icon: tv
      # Lane 1 on a multi-column device, and a separator claims the SECTION it
      # opens -- so Activity and the Display block ride along without their own
      # tags. Ignored entirely when ui.columns is 1, i.e. on every remote.
      column: 1
      # AV lock, on the right end of the divider. Locking is one tap; unlocking
      # opens a PIN keypad that writes to the same scratchpad helper the wall
      # dashboard's keypad uses, so Home Assistant does the checking and there
      # is one definition of the PIN in the house.
      lock:
        entity: input_boolean.tv_wall_locked
        pin_entry: input_text.tv_wall_lock_pin_entry
        # Read only so the keypad can SAY "wrong PIN". HA still does the real
        # validation via automation.tv_wall_validate_unlock_pin -- which only
        # acts on a match, so a wrong entry previously produced no feedback at
        # all and you had to wait to see whether the lock opened. Being inside
        # card options, EntityRefs picks it up and subscribes it automatically.
        pin_entity: input_text.tv_wall_lock_pin
  - type: bubble_select
    options:
      name: Activity
      icon: tv
      open_on: Watch
      active_entity: input_select.lr_av_activity
      options:
      - name: Apple TV
        service: script.lr_av_watch_apple_tv
        active_value: Watch Apple TV
      - name: Kaleidescape
        service: script.lr_av_watch_kaleidescape
        active_value: Watch Kaleidescape
      - name: Nintendo
        service: script.lr_av_play_switch
        active_value: Play Switch
      - name: 'Off'
        service: script.lr_av_off
        active_value: 'Off'
  - type: conditional
    options:
      entity_id: input_select.lr_av_activity
      state_not: 'Off'
      cards:
      - type: separator
        options:
          name: Display
          icon: screen
      - type: bubble_select
        options:
          name: Brightness
          icon: brightness
          active_entity: input_select.novastar_brightness_preset
          options:
          - name: Auto
            service: script.novastar_brightness_auto
            active_value: Auto
          - name: Dim
            service: script.novastar_brightness_dim
            active_value: Dim
          - name: Normal
            service: script.novastar_brightness_normal
            active_value: Normal
          - name: Bright
            service: script.novastar_brightness_bright
            active_value: Bright
      - type: bubble_select
        options:
          name: Screen Size
          icon: aspect
          active_entity: input_select.lr_screen_layout
          options:
          - name: Full
            service: script.lr_screen_full
            active_value: Full
          - name: Compact
            service: script.lr_screen_compact
            active_value: Compact
          # Labelled "Multi", but the engine's option string is "Multi View" --
          # active_value has to be the engine's, the name is what fits the pill.
          - name: Multi
            service: script.lr_screen_multi
            active_value: Multi View
      # Multi-View, mirroring the TV Wall dashboard: how many panes, then one
      # picker per additional pane. Only while the wall is actually in Multi
      # View -- these controls mean nothing in Full or Compact.
      #
      # Each picker writes its input_select directly rather than going through a
      # script, because unlike Screen Size there is nothing to wrap: the options
      # ARE the entity's options. They are rebuilt at runtime by
      # automation.lr_mv_restrict_source_options from the input-name helpers, so
      # the list below is the full set and the engine refuses the impossible
      # picks (the VRROOM can carry only two distinct sources at once).
      - type: conditional
        options:
          entity_id: input_select.lr_screen_layout
          state: Multi View
          cards:
          # The Panes picker used to live here. It was redundant and actively
          # harmful: script.lr_screen_multiview DERIVES the pane count from how
          # many of the source slots are not Off (count = 1 + active, capped at
          # 4) and WRITES input_select.lr_multiview_layout itself. Choosing a
          # count by hand was overwritten on the next apply, and worse, the
          # source pickers were gated on it -- so picking '2 Sources' hid the
          # very slots you needed to fill. All three slots now show whenever the
          # wall is in Multi View; set one to Off to drop its pane.
          #
          # All FOUR panes are reachable, though only three DISTINCT feeds are.
          # HDMI2 is locked to mirror HDMI1 so the Envy bypass always has one,
          # which leaves the primary plus NovaStar inputs 3 and 4 -- the direct
          # Apple TVs. The fourth pane comes from pointing a slot at the SAME
          # source as the primary: mv_apply_layout gives it groupId 1 and it
          # reuses TX0 rather than spending an input. An earlier version of this
          # comment called three the ceiling and dropped the Source 4 picker on
          # that basis -- wrong, and it is the very duplicate-source case
          # sensor.lr_envy_layers exists for, where two tiles sit behind the
          # Envy and both have to bypass together.
          - type: bubble_select
            options:
              name: Source 2
              icon: source
              active_entity: input_select.lr_mv_source_2
              # Latch the remote's physical keys onto THIS pane. One
              # shared entity holds the latch, so tapping another
              # pane's icon releases this one. Not drawn for Off or
              # Switch: neither has a remote entity to send to.
              toggle:
                icon: remote
                entity: input_select.lr_key_target
                on_value: Source 2
                off_value: Default
                hidden_for: ['Off', 'Switch']
              options:
              - name: 'Off'
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: 'Off'}
                active_value: 'Off'
              - name: Apple TV
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: ATV1}
                active_value: ATV1
              - name: Apple TV 2
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: ATV2}
                active_value: ATV2
              - name: Apple TV 3
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: ATV3}
                active_value: ATV3
              - name: Kaleidescape
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: KScape}
                active_value: KScape
              - name: Switch
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_2
                data: {option: Switch}
                active_value: Switch
          - type: bubble_select
            options:
              name: Source 3
              icon: source
              active_entity: input_select.lr_mv_source_3
              # Latch the remote's physical keys onto THIS pane. One
              # shared entity holds the latch, so tapping another
              # pane's icon releases this one. Not drawn for Off or
              # Switch: neither has a remote entity to send to.
              toggle:
                icon: remote
                entity: input_select.lr_key_target
                on_value: Source 3
                off_value: Default
                hidden_for: ['Off', 'Switch']
              options:
              - name: 'Off'
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: 'Off'}
                active_value: 'Off'
              - name: Apple TV
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: ATV1}
                active_value: ATV1
              - name: Apple TV 2
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: ATV2}
                active_value: ATV2
              - name: Apple TV 3
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: ATV3}
                active_value: ATV3
              - name: Kaleidescape
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: KScape}
                active_value: KScape
              - name: Switch
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_3
                data: {option: Switch}
                active_value: Switch
          - type: bubble_select
            options:
              name: Source 4
              icon: source
              active_entity: input_select.lr_mv_source_4
              # Latch the remote's physical keys onto THIS pane. One
              # shared entity holds the latch, so tapping another
              # pane's icon releases this one. Not drawn for Off or
              # Switch: neither has a remote entity to send to.
              toggle:
                icon: remote
                entity: input_select.lr_key_target
                on_value: Source 4
                off_value: Default
                hidden_for: ['Off', 'Switch']
              options:
              - name: 'Off'
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: 'Off'}
                active_value: 'Off'
              - name: Apple TV
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: ATV1}
                active_value: ATV1
              - name: Apple TV 2
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: ATV2}
                active_value: ATV2
              - name: Apple TV 3
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: ATV3}
                active_value: ATV3
              - name: Kaleidescape
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: KScape}
                active_value: KScape
              - name: Switch
                service: input_select.select_option
                entity_id: input_select.lr_mv_source_4
                data: {option: Switch}
                active_value: Switch
  - type: separator
    options:
      name: Lights
      # Opens lane 2, which then carries Shades and Climate too (their own
      # separators are untagged, so they inherit rather than reset).
      column: 2
      icon: light
  - type: bubble_select
    options:
      name: Light Scenes
      icon: scene
      open_on: Lights
      active_entity: input_select.living_room_active_scene
      options:
      - name: Bright
        service: script.lr_lights_bright
        active_value: Bright
      - name: Entertain
        service: script.lr_lights_entertain
        active_value: Entertain
      - name: Relax
        service: script.lr_lights_relax
        active_value: Relax
      - name: Movie
        service: script.lr_lights_movie
        active_value: Movie
      - name: 'Off'
        service: script.lr_lights_off
        active_value: 'Off'
      # Last, like the bedroom's nightstands: a control rather than a choice, and
      # the list reads as options until it stops being one. The fan's down-light
      # is the one lamp in here no scene owns, so it is the one you end up
      # reaching for the wall switch to adjust.
      - type: light
        entity_id: light.living_room_ceiling_fan_down_light
        name: Fan Light
  - type: separator
    options:
      name: Shades
      icon: curtain
  - type: shade_control
    options:
      name: Shades
      target_entity: input_select.lr_shade_target
      open:
        service: script.lr_shade_target_open
      stop:
        service: script.lr_shade_target_stop
      close:
        service: script.lr_shade_target_close
  - type: separator
    options:
      name: Climate
      icon: thermostat
  - type: bubble_climate
    options:
      entity_id: climate.living_room
      step: 1
      # Hold comes from custom_components/ecobee_hold, which reads the vendor
      # HomeKit characteristic homekit_controller drops. Resume presses the
      # thermostat's own clear-hold button -- a real resume, not a setpoint
      # rewrite. See that component's docstring for why 3 == "holding".
      hold_entity: binary_sensor.living_room_holding
      clear_hold:
        service: button.press
        entity_id: button.living_room_clear_hold
  # Four named speeds instead of +/- steppers. The fan has SIX levels, so the
  # labels map onto every other one (33/67/100); the speed sensor buckets by
  # range on the way back, so a level set from the wall remote still shows a
  # label rather than blank.
  - type: bubble_select
    options:
      name: Ceiling Fan
      icon: fan
      active_entity: sensor.living_room_ceiling_fan_speed
      options:
      - name: Fast
        service: fan.set_percentage
        entity_id: fan.living_room_ceiling_fan
        data:
          percentage: 100
        active_value: Fast
      - name: Medium
        service: fan.set_percentage
        entity_id: fan.living_room_ceiling_fan
        data:
          percentage: 67
        active_value: Medium
      - name: Low
        service: fan.set_percentage
        entity_id: fan.living_room_ceiling_fan
        data:
          percentage: 33
        active_value: Low
      - name: 'Off'
        service: fan.turn_off
        entity_id: fan.living_room_ceiling_fan
        active_value: 'Off'
- name: Master Bedroom
  # Dock view -- see the note on the Living Room page. Lights and Bed press the
  # real Lutron keypad / bed BUTTON entities, exactly as the in-hand controls do,
  # so every downstream sync and invalidate automation fires with them.
  # input_select.master_bedroom_active_scene and input_select.bed_active_preset
  # are TRACKERS written by automation -- writing to them here would move the
  # indicator and nothing else.
  dock_cards:
  # The SAME now-playing strip the in-hand page uses -- launcher and all.
  # `dock_index_only` keeps it off the submenus, which need that height.
  - type: conditional
    options:
      # Two gates, outer first: the SOURCE must not be Off. A player can sit in
      # a stale 'paused' long after the system is down, and a now-playing row
      # for a dark room is worse than none.
      entity_id: input_select.mb_av_activity
      state_not: 'Off'
      dock_index_only: true
      card:
        type: conditional
        options:
          # ...and the player must actually have something on. The strip says
          # "Nothing playing" rather than vanishing, which is right on the
          # in-hand page and wrong on a dock that is otherwise all live status.
          entity_id: media_player.master_bedroom_2
          state_in: ['playing', 'paused']
          card:
            type: media_player
            options:
              entity_id: media_player.master_bedroom_2
              state_in: ['playing', 'paused']
              card:
                type: media_player
                options:
                  entity_id: media_player.master_bedroom_2
              variant: strip
              art_size: 56
              button_size: 60
              launcher:
                icon: apps
                name: Apple TV
                columns: 3
                item_height: 64
                item_font_size: 12
                items: !include atv_items_mb.yaml
  - type: dock_menu
    options:
      columns: 2
      # Two sizes, because the now-playing strip is not always there.
      #
      # 150dp is the CEILING for the solo case, derived not guessed: the
      # LazyColumn is ~492dp tall (status bar to room-label strip) and carries
      # 8dp of contentPadding top and bottom, leaving 476dp; three tiles plus
      # two 10dp gaps means 3H + 20 <= 476, so H <= 152. 154 overflowed by 2dp,
      # which is why the page scrolled "just barely". 150 keeps a 6dp buffer.
      #
      # 114dp is the measured fit WITH the strip (grid ran to y=688, room label
      # at y=734). `compact_when` must mirror the conditional on the media card
      # above -- PageContent lays cards out in a LazyColumn, so this card cannot
      # measure its siblings and has to be told.
      button_height: 150
      button_height_compact: 106
      # ONE definition, shared with the card that draws the strip -- see
      # the note on binary_sensor.mb_dock_media_visible in templates.yaml. Keying
      # this on the activity alone is what left the index using short
      # tiles with no strip present.
      compact_when:
        entity_id: binary_sensor.mb_dock_media_visible
        state: 'on'
      menus:
      - name: Activity
        close_on_select: true
        icon: tv
        status_entity: input_select.mb_av_activity
        items:
        - {name: Apple TV, icon: tv, service: script.mb_av_watch_apple_tv, active_value: 'Watch Apple TV'}
        - {name: 'Off', icon: power, service: script.mb_av_off, active_value: 'Off'}
      - name: Lights
        close_on_select: true
        icon: light
        status_entity: input_select.master_bedroom_active_scene
        items:
        # Corner icon: the two nightstands, which the in-hand page has as
        # individual light cards and the dock had no way to reach. They are a
        # pair you toggle, not a scene, so they sit beside the scenes rather
        # than among them.
        - name: Nightstands
          corner: true
          icon: lamp
          status_entity: light.master_bedroom_nightstand_1
          items:
          - {name: His, icon: lamp, service: light.toggle, entity_id: light.master_bedroom_nightstand_1}
          - {name: Hers, icon: lamp, service: light.toggle, entity_id: light.master_bedroom_nightstand_2}
          - {name: Both On, icon: lights, service: light.turn_on,
             entity_id: [light.master_bedroom_nightstand_1, light.master_bedroom_nightstand_2]}
          - {name: Both Off, icon: power, service: light.turn_off,
             entity_id: [light.master_bedroom_nightstand_1, light.master_bedroom_nightstand_2]}
        - {name: Bright, icon: bright, service: button.press, entity_id: button.master_bedroom_keypad_master_button_1}
        - {name: Entertain, icon: entertain, service: button.press, entity_id: button.master_bedroom_keypad_master_button_2}
        - {name: Relax, icon: relax, service: button.press, entity_id: button.master_bedroom_keypad_master_button_3}
        - {name: Romance, icon: romance, service: input_boolean.toggle, entity_id: input_boolean.master_romance_mode}
        - {name: Good Night, icon: night, service: script.good_night}
        - {name: 'Off', icon: power, service: button.press, entity_id: button.master_bedroom_keypad_master_off}
      - name: Shades
        icon: shade
        # status_entity is the TARGET, because the nested "Which shades" tile and
        # its highlight are driven from it. The INDEX wants something else --
        # whether the shades are actually open -- so it gets its own source, and
        # the name drops to the grey caption like every other tile.
        status_entity: input_select.master_shade_target
        index_status:
          status_entity: sensor.mb_shade_summary
        items:
        - {name: Open, icon: open, service: script.mb_shade_target_open}
        - {name: Close, icon: close, service: script.mb_shade_target_close}
        - {name: Stop, icon: stop, service: script.mb_shade_target_stop}
        - name: Which shades
          icon: shade
          # Labelled with the CURRENT target rather than "Which shades", so the
          # tile answers the question instead of asking it. Choosing one closes
          # this level and returns to Shades, where Open/Close/Stop are waiting.
          status_entity: input_select.master_shade_target
          close_on_select: true
          items:
          - {name: 'All Shades', icon: shades, service: input_select.select_option, entity_id: input_select.master_shade_target, data: {option: 'All Shades'}, active_value: 'All Shades'}
          - {name: 'East', icon: east, service: input_select.select_option, entity_id: input_select.master_shade_target, data: {option: 'East'}, active_value: 'East'}
          - {name: 'North', icon: north, service: input_select.select_option, entity_id: input_select.master_shade_target, data: {option: 'North'}, active_value: 'North'}
      - name: Climate
        icon: climate
        # Current temperature large, setpoints as coloured pills beneath:
        # BLUE is the cool setpoint, ORANGE the heat one. In Auto a
        # thermostat has both, so both are drawn. The single-mode entries
        # carry a `state` because they differ only by colour -- the same
        # number is blue when cooling and orange when heating. The Auto
        # pair needs no condition: low/high are null outside heat_cool and
        # an unresolvable pill is simply skipped.
        status_entity: climate.bedrooms
        status_big: "{current_temperature}\u00B0"
        status_pills:
        - {format: "{temperature}\u00B0", color: cool, state: cool}
        - {format: "{temperature}\u00B0", color: heat, state: heat}
        - {format: "{target_temp_low}\u00B0", color: heat}
        - {format: "{target_temp_high}\u00B0", color: cool}
        modes:
          entity_id: climate.bedrooms
          options:
          - {name: Cool, icon: cool, service: climate.set_hvac_mode, entity_id: climate.bedrooms, data: {hvac_mode: 'cool'}, active_value: 'cool'}
          - {name: Heat, icon: heat, service: climate.set_hvac_mode, entity_id: climate.bedrooms, data: {hvac_mode: 'heat'}, active_value: 'heat'}
          - {name: Auto, icon: auto-mode, service: climate.set_hvac_mode, entity_id: climate.bedrooms, data: {hvac_mode: 'heat_cool'}, active_value: 'heat_cool'}
          - {name: 'Off', icon: power, service: climate.set_hvac_mode, entity_id: climate.bedrooms, data: {hvac_mode: 'off'}, active_value: 'off'}
        # The in-hand page's own climate card, embedded: rollable temperature,
        # +/- steppers, both bounds in Auto, and the hold shown inline with its
        # clear button -- all of which a grid of fixed setpoints could not do.
        card:
          type: bubble_climate
          options:
            entity_id: climate.bedrooms
            step: 1
            # The picker IS the page here; a modal inside a page is a
            # second layer to dismiss for nothing.
            inline: true
            hold_entity: binary_sensor.bedrooms_holding
            clear_hold:
              service: button.press
              entity_id: button.bedrooms_clear_hold
        items: []
      - name: Fan
        close_on_select: true
        icon: fan
        status_entity: fan.master_ceiling
        status_attribute: percentage
        status_from_items: true
        items:
        - {name: Fast, icon: speed-high, service: fan.set_percentage, entity_id: fan.master_ceiling, data: {percentage: 100}}
        - {name: Medium, icon: speed-medium, service: fan.set_percentage, entity_id: fan.master_ceiling, data: {percentage: 67}}
        - {name: Low, icon: speed-low, service: fan.set_percentage, entity_id: fan.master_ceiling, data: {percentage: 33}}
        - {name: 'Off', icon: power, service: fan.turn_off, entity_id: fan.master_ceiling}
      - name: Bed
        icon: bed
        status_entity: input_select.bed_active_preset
        items:
        - {name: Flat, icon: flat, service: button.press, entity_id: button.bedroom_preset_flat}
        - {name: Zero G, icon: zero-g, service: button.press, entity_id: button.bedroom_preset_zero_g}
        - {name: TV, icon: bed-tv, service: button.press, entity_id: button.bedroom_preset_tv}
        - {name: Snore, icon: snore, service: button.press, entity_id: button.bedroom_preset_anti_snore}
  # This room drives its OWN Sonos, so it needs its own OSD: the page's volume
  # keys call script.mb_sonos_volume_* and the global overlay watches the living
  # room's cache, which never moves here -- the reason no OSD appeared at all.
  # Whole-value override, not a merge: speaker, cache and gate only mean anything
  # together.
  overlay:
    volume_entity: input_number.mb_sonos_volume_cache
    mute_entity: media_player.master_bedroom
    condition:
      entity_id: binary_sensor.mb_osd_allowed
      state: 'on'
  # Replicates what the four bedside Picos do, in the order the room is used:
  # what's on, the lights, the shades, the bed, the climate. Every binding here
  # is the SAME service the Pico presses -- the keypad button entities, the same
  # bed preset buttons -- so the touchscreen and the physical remotes cannot
  # drift apart.
  cards:
  - type: conditional
    options:
      entity_id: input_select.mb_av_activity
      state: Watch Apple TV
      # Sidebar lane on a multi-column device (the Pixel Tablet); READ ONLY
      # when ui.columns > 1, so the remotes ignore it entirely.
      column: 3
      cards:
      - type: media_player
        options:
          entity_id: media_player.master_bedroom_2
          variant: strip
          art_size: 68
          launcher:
            icon: apps
            name: Apple TV
            columns: 3
            item_height: 64
            item_font_size: 12
            items: !include atv_items_mb.yaml
  - type: separator
    options:
      name: Watch
      icon: tv
      # Lanes mirror the Living Room page: 1 = what is on, 2 = the room, 3 = the
      # now-playing card. A separator claims the section it opens, so Activity
      # rides along. Ignored entirely when ui.columns is 1, i.e. on the remotes.
      column: 1
  - type: bubble_select
    options:
      name: Activity
      icon: tv
      open_on: Watch
      active_entity: input_select.mb_av_activity
      options:
      - name: Apple TV
        service: script.mb_av_watch_apple_tv
        active_value: Watch Apple TV
      - name: 'Off'
        service: script.mb_av_off
        active_value: 'Off'
  - type: separator
    options:
      name: Lights
      icon: light
      # Opens lane 2, which then carries Shades, Bed and Climate too -- their
      # separators are untagged, so they inherit rather than reset.
      column: 2
  # Presses the Lutron keypad BUTTON entities, exactly as bedside pico 2 does,
  # so the real hardware scene fires and every downstream automation (scene
  # sync, scene invalidate) fires with it. active_entity highlights whichever
  # scene is live; input_select.master_bedroom_active_scene is maintained by
  # automation.master_bedroom_scene_sync.
  #
  # Romance and Good Night sit in this same list because from the bed they are
  # the same kind of decision as a scene -- "make the room be like this". The
  # one wrinkle: neither can HIGHLIGHT. bubble_select has a single active_entity
  # per card, and the scene tracker knows nothing about romance mode or bedtime,
  # so those two read as actions in a list that is otherwise showing state.
  - type: bubble_select
    options:
      name: Lights
      icon: light
      open_on: Lights
      active_entity: input_select.master_bedroom_active_scene
      options:
      - name: Bright
        service: button.press
        entity_id: button.master_bedroom_keypad_master_button_1
        active_value: Bright
      - name: Entertain
        service: button.press
        entity_id: button.master_bedroom_keypad_master_button_2
        active_value: Entertain
      - name: Relax
        service: button.press
        entity_id: button.master_bedroom_keypad_master_button_3
        active_value: Relax
      # Toggles the boolean that automation.master_romance_mode watches, so this
      # behaves identically to the bedside pico's Off button.
      - name: Romance
        service: input_boolean.toggle
        entity_id: input_boolean.master_romance_mode
      - name: 'Off'
        service: button.press
        entity_id: button.master_bedroom_keypad_master_off
        active_value: 'Off'
      - name: Good Night
        service: script.good_night
      # The two nightstands live INSIDE this dropdown rather than as their own
      # pill cards: from the bed they are the same decision as the scenes above
      # ("make the room be like this"), and on a 3" screen two full-width slider
      # pills cost more of the page than they earn when the usual answer is a
      # scene. They are last because they are controls, not choices -- the list
      # reads as options until it stops being one.
      - type: light
        entity_id: light.master_bedroom_nightstand_1
        name: Nightstand His
      - type: light
        entity_id: light.master_bedroom_nightstand_2
        name: Nightstand Hers
  - type: separator
    options:
      name: Shades
      icon: curtain
  # Same card and same shape as the Living Room's: pick a target, then act on it.
  # The scripts resolve the picker to a cover and call the TEMPLATE wrapper, not
  # the _bond entity, which is what keeps the position trackers honest -- Bond is
  # RF one-way, so those trackers are the source of truth for open/closed.
  - type: shade_control
    options:
      name: Shades
      target_entity: input_select.master_shade_target
      open:
        service: script.mb_shade_target_open
      stop:
        service: script.mb_shade_target_stop
      close:
        service: script.mb_shade_target_close
  - type: separator
    options:
      name: Bed
      icon: bed
  - type: bubble_select
    options:
      name: Position
      icon: bed
      open_on: Bed
      active_entity: input_select.bed_active_preset
      options:
      - name: TV
        service: button.press
        entity_id: button.bedroom_preset_tv
        active_value: TV
      - name: Zero G
        service: button.press
        entity_id: button.bedroom_preset_zero_g
        active_value: Zero G
      - name: Flat
        service: button.press
        entity_id: button.bedroom_preset_flat
        active_value: Flat
      # The bed enters this position on its own, via its built-in anti-snore --
      # so this entry is as much a READOUT as a control. Without it the dropdown
      # showed the previous preset (or nothing) while the bed had already moved,
      # which is the thing that made the remote look wrong at 3am.
      - name: Snore
        service: button.press
        entity_id: button.bedroom_preset_anti_snore
        active_value: Snore
  - type: separator
    options:
      name: Climate
      icon: thermostat
  # climate.bedrooms, not climate.new_master: the "New Master" ecobee exists but
  # is not commissioned yet. Swap the entity_id here when it is.
  - type: bubble_climate
    options:
      entity_id: climate.bedrooms
      step: 1
      hold_entity: binary_sensor.bedrooms_holding
      clear_hold:
        service: button.press
        entity_id: button.bedrooms_clear_hold
  # step 17 ~= the six discrete levels LocalTuya exposes (percentage_step 16.67),
  # so one press moves exactly one level instead of landing between them.
  - type: bubble_select
    options:
      name: Ceiling Fan
      icon: fan
      active_entity: sensor.master_ceiling_fan_speed
      options:
      - name: Fast
        service: fan.set_percentage
        entity_id: fan.master_ceiling
        data:
          percentage: 100
        active_value: Fast
      - name: Medium
        service: fan.set_percentage
        entity_id: fan.master_ceiling
        data:
          percentage: 67
        active_value: Medium
      - name: Low
        service: fan.set_percentage
        entity_id: fan.master_ceiling
        data:
          percentage: 33
        active_value: Low
      - name: 'Off'
        service: fan.turn_off
        entity_id: fan.master_ceiling
        active_value: 'Off'
  # Page-scoped hotkeys: while THIS page is showing, the physical keys drive the
  # bedroom instead of the living room. Resolution is per key, page then global,
  # so only the keys listed here change -- VOICE's action, SYNC and anything else
  # is inherited from the global block untouched.
  #
  # This is what makes the page the room context, and it is why carrying a remote
  # between rooms works: what the keys control follows what you are LOOKING at,
  # not where the remote happens to be.
  #
  # NOT listed here, deliberately: LIGHT / CURTAIN / SCENE / AC. Those four are a
  # per-REMOTE concern, not a per-page one -- the HA100A prints LIGHT/SHADE/
  # MUSIC/AC on them and the HA100B prints SCAN/PLAY-PAUSE/STOP/SCAN FWD, so what
  # they should do depends on the plastic, which no page can know.
  hotkeys:
  - key: UP
    service: script.mb_av_nav_up
  - key: DOWN
    service: script.mb_av_nav_down
  - key: LEFT
    service: script.mb_av_nav_left
  - key: RIGHT
    service: script.mb_av_nav_right
  - key: CENTER
    service: script.mb_av_nav_select
  - key: BACK
    service: script.mb_av_nav_back
  - key: HOME
    service: script.mb_av_nav_home
  - key: MENU
    service: script.mb_av_menu
  - key: VOLUME_UP
    service: script.mb_sonos_volume_up
  - key: VOLUME_DOWN
    service: script.mb_sonos_volume_down
  - key: MUTE
    service: script.mb_sonos_mute_toggle
  - key: PAGE_UP
    service: script.mb_av_channel_up
  - key: PAGE_DOWN
    service: script.mb_av_channel_down
  - key: CUSTOM_1
    service: script.mb_av_watch_apple_tv
  # CUSTOM_2 and CUSTOM_3 select the Kaleidescape and the Switch, neither of
  # which exists in this room. Listed with no action so they resolve, are
  # handled, and do nothing -- rather than inheriting and switching the LIVING
  # ROOM's activity from the bedroom page.
  - key: CUSTOM_2
  - key: CUSTOM_3
  - key: CUSTOM_4
    service: script.mb_av_off
  - key: POWER
    service: script.mb_av_off
  # The four shortcut keys, mapped to THIS page's sections -- the same job they
  # do on the Living Room page, pointed at the bedroom's own sections. No
  # `page:` clause: they scroll within whatever page is showing, so they stay
  # useful if the page set ever changes.
  #
  # MUSIC (SCENE) goes to Watch rather than a music section: there is no audio
  # section here, and scrolling back up to the activity selector is the more
  # useful thing that key can do from anywhere on the page. Watch also carries
  # `open_on: Watch`, so it pops the Activity dropdown open on arrival.
  #
  # These are NOT quiet: they move this display, so it has to be lit to be worth
  # pressing -- the same reason the Living Room page leaves them loud.
  - key: LIGHT          # A unit prints LIGHT
    scroll_to: Lights
  - key: CURTAIN        # A unit prints SHADE
    scroll_to: Shades
  - key: SCENE          # A unit prints MUSIC
    scroll_to: Watch
  - key: AC             # A unit prints AC
    scroll_to: Climate
  # The VOICE key streams to whichever Apple TV this page belongs to. The rest of
  # the voice config (timings, prompts) is inherited.
  voice:
    path: /api/appletv_siri/audio/master_bedroom
# Status lives OFF the pager, reached from the swipe-up panel's Status row.
#
# These readouts are reference material you go LOOKING for -- "what is the
# chain actually doing right now" -- rather than something glanced at in
# passing, so they do not earn a permanent dot beside the rooms used daily.
# Same cards, same options; only the way in changed.
status:
  title: TV Wall Status
  cards:
  - type: separator
    options:
      name: Source
      icon: tv
  - type: monitor
    options:
      entities:
      - entity_id: sensor.vrroom_tx0_source
        name: Source
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: resolution
        name: Resolution
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: dynamic_range
        name: Dynamic Range
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: color_space
        name: Color Space
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: bit_depth
        name: Bit Depth
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: chroma
        name: Chroma
      - entity_id: sensor.vrroom_tx0_video_plain
        attribute: hdcp
        name: HDCP
      - entity_id: sensor.vrroom_earc_audio_out
        name: Audio (VRROOM)
      - entity_id: sensor.living_room_audio_input_format
        name: Audio (Sonos)
  - type: separator
    options:
      name: Envy In
      icon: remote
  - type: monitor
    options:
      entities:
      # First, because it changes how everything below it should be read: when
      # the Envy is bypassed the wall is fed from VRROOM TX1 and these incoming
      # -signal rows describe a path the picture is not currently taking.
      - entity_id: binary_sensor.novastar_envy_bypassed
        name: Envy Bypass
      - entity_id: sensor.madvr_envy_10_10_10_167_incoming_signal_resolution
        name: Resolution
      - entity_id: sensor.madvr_envy_10_10_10_167_incoming_signal_frame_rate
        name: Frame Rate
      - entity_id: sensor.madvr_envy_10_10_10_167_incoming_signal_hdr_mode
        name: HDR Mode
      - entity_id: sensor.madvr_envy_10_10_10_167_incoming_signal_aspect_ratio
        name: Signal Aspect
      - entity_id: sensor.madvr_envy_10_10_10_167_aspect_ratio_name
        name: Content AR
  - type: separator
    options:
      name: Envy Out
      icon: remote
  - type: monitor
    options:
      entities:
      - entity_id: sensor.madvr_envy_10_10_10_167_outgoing_signal_resolution
        name: Resolution
      - entity_id: sensor.madvr_envy_10_10_10_167_outgoing_signal_frame_rate
        name: Frame Rate
      - entity_id: sensor.madvr_envy_10_10_10_167_outgoing_signal_hdr_mode
        name: HDR Mode
  - type: separator
    options:
      name: Screen
      icon: screen
  - type: monitor
    options:
      entities:
      - entity_id: sensor.novastar_output
        attribute: frame_rate
        name: Frame Rate
      - entity_id: sensor.novastar_output
        attribute: bit_depth
        name: Bit Depth
      - entity_id: input_select.novastar_brightness_preset
        name: Mode
      - entity_id: sensor.novastar_auto_hdr_nits_target
        name: Auto target
      - entity_id: sensor.fp2_lr_lux_smoothed
        name: Ambient lux

voice:
  # Where the VOICE key streams the mic (raw PCM16, 16 kHz mono, chunked). The
  # remote makes NO routing decision - this endpoint does. custom_components/
  # hap_remote sends it to Siri on the Apple TV while the AV activity is
  # "Watch Apple TV", and to HA Assist otherwise.
  # Names the Apple TV: there is no default, so an utterance always says
  # where it is going. Slug comes from the Apple TV's own name.
  path: /api/appletv_siri/audio/living_room_1
  max_ms: 10000        # hard cap on one utterance
  silence_ms: 1200     # quiet AFTER speech before it's considered finished
  no_speech_ms: 4000   # give up if you press the key and never speak

  # Shown while listening, at the moment you are deciding what to say. A mic
  # that says "Listening…" proves it works but not what it UNDERSTANDS, and an
  # undiscoverable vocabulary gets used for the two phrases you already know.
  # Gated to Kaleidescape: movie searches are useful advice in front of the
  # theater and noise in front of an Apple TV (where VOICE goes to Siri anyway).
  # Each line is a phrasing the sentence templates actually match -- keep them
  # in step with custom_sentences/en/kaleidescape_voice.yaml.
  suggest_entity: input_select.lr_av_activity
  suggest_state: Watch Kaleidescape
  suggest_title: Try saying
  suggestions:
    - play Air Force One
    - find james bond
    - show me my movies from the marvel universe
    - what Kubrick movies do I have
    - surprise me

# Motion wake: light the screen when the remote is picked up.
#
# Per-remote because the assumption is not universal -- it assumes the remote
# rests on something STILL. master_1 and master_2 live in a bed, where the
# surface moves whenever its owner does; at the original fixed 0.9 threshold the
# display re-lit within seconds of every timeout, all night. The living room unit
# on a side table never had the problem.
#
# `hits` is what actually separates the two cases. Amplitude alone cannot:
# rolling over can outweigh a gentle pick-up. But a pick-up is SUSTAINED -- the
# remote keeps moving while it travels to a hand -- where a bed jolt is one spike
# and over. Requiring consecutive samples discriminates on duration, not force.
#
# Tunable live: the app reads these on every sensor event, so a Sync re-tunes
# without a reinstall. Only `enabled` needs a restart (it decides whether the
# sensor is registered at all).
motion_wake:
  # Rewritten 2026-08-17 to detect a PICK-UP rather than a jolt.
  #
  # The old test was the change in the acceleration vector's MAGNITUDE. That
  # responds to a knock -- someone shifting on a mattress -- but is nearly blind
  # to the thing actually worth waking for: lifting a remote rotates it, and
  # rotation leaves the magnitude at ~1 g while only the axis components move. So
  # there was no threshold that both woke on a pick-up and ignored a bed, and
  # every retune traded one against the other.
  #
  # It now watches the DIRECTION of the low-passed gravity vector and fires on a
  # tilt of `tilt_degrees`, with `jerk_ratio` kept for a deliberate shake that
  # does not turn the remote. Both are scale-free, which matters more than it
  # sounds: master_2's accelerometer reads ~2x true (18.9 m/s2 at rest against
  # 9.6 on its twin), so the same `threshold` number used to mean half as much on
  # that unit as on the others. Angles and ratios finally mean the same thing on
  # every remote.
  tilt_degrees: 10
  jerk_ratio: 0.25
  hits: 2
  settle_seconds: 8
  cooldown_seconds: 2
  # Off: a remote on a USB-C cable is usually in a hand, and this hardware cannot
  # tell a cable from the dock -- both enumerate as Mains. Suppressing wake here
  # would break the cable case to fix one that does not need fixing, since a
  # docked remote already has its screen held on by dock_display.
  ignore_while_charging: false
  devices:
    # The bed pair. A body-shift translates the remote without turning it, so the
    # tilt gate does most of the work here and these can now sit close to the
    # global values instead of being cranked until a real pick-up failed too.
    master_1:
      tilt_degrees: 14
      hits: 2
      window_ms: 1000
      settle_seconds: 10
    master_2:
      tilt_degrees: 14
      hits: 2
      window_ms: 1000
      settle_seconds: 10
    # living inherits the global values -- a side table does not move on its own.

# Docked remotes stay awake as a dim status panel instead of sleeping: the dock
# supplies mains power, so the timeout saves nothing there. Any touch or button
# raises the backlight for `bright_seconds`, then it fades back.
# Idle clock for a DOCKED remote. Off the dock nothing changes -- the display
# still sleeps, so this cannot cost battery. Enabled only on the bedroom pair;
# the living-room remote sits in a room where a lit clock is not wanted.
screensaver:
  enabled: true
  idle_seconds: 20
  clock_24h: true
  # Not white: this faces a bed for eight hours a night, and white on black at
  # full brightness is a lamp.
  color: '#8A8A8A'
  show_date: true
  # US order: weekday, month, day.
  date_format: 'EEEE MMMM d'
  # Its own backlight, well above the dock's 1% dashboard dim -- at that level
  # the clock renders perfectly and is invisible, which is exactly how it looked
  # like it had never started.
  brightness: 0.15
  # Daytime is a different room: readable across it in sunlight. The house
  # already decides when it is day for the lighting, so this follows that rather
  # than inventing a second definition that would drift from the first.
  day_brightness: 1.0
  day_entity: input_select.lighting_time_period
  day_states: ['day']

dock_display:
  enabled: true
  dim_level: 0.02
  bright_level: 0.6
  bright_seconds: 20
  devices:
    # Bedroom pair: dimmer still, and back down sooner. This is a light source
    # aimed at a bed for most of the night.
    master_1:
      dim_level: 0.01
      bright_seconds: 15
    master_2:
      dim_level: 0.01
      bright_seconds: 15

overlay:
  # Transient volume/mute OSD on the remote. volume_entity is the CACHE the
  # volume scripts step instantly on the button press (the same one that drives
  # the Envy OSD) - the Sonos's own volume_level lags too much to feel right.
  volume_entity: input_number.lr_sonos_volume_cache
  mute_entity: media_player.living_room
  # Turning the system off mutes the Sonos (turn_off does nothing in eARC
  # passthrough), and the app announced a mute nobody pressed. binary_sensor.
  # lr_osd_allowed is the gate: the system is on AND the AV engine is not
  # currently changing the Sonos itself. The engine raises timer.lr_osd_suppress
  # BEFORE it mutes, so the flag beats the state change to the remote instead of
  # racing it -- and it stays up long enough to cover the volume settling too.
  condition:
    entity_id: binary_sensor.lr_osd_allowed
    state: 'on'
# Swipe DOWN on the status strip -> the Device panel. The stock launcher used to
# own a swipe-down panel here, so the gesture is already muscle memory.
#
# The manual "Force stop HaRemote" item was removed 2026-08-31. It existed
# because com.aiks.HaRemote holds a partial wake lock while it runs and came
# back on every boot, so a human had to force-stop it. That is now automatic:
# the input bridge starts at boot (astrion/boot-hook/) with --stop=com.aiks.HaRemote
# and force-stops the stock app every 60s, and the custom app is HOME so stock
# never launches as launcher anyway. Nothing left for a person to do.
#
# Still NEVER `pm disable-user com.aiks.HaRemote` -- it is the launcher and
# disabling it bricks the HA100 into an SP-Flash-Tool-only bootloop. The
# watchdog force-STOPS (transient, safe); it never disables.
gestures:
  swipe_down:
    title: Device
    items:
    - name: Android Settings
      action: settings
hotkeys:
- key: UP
  service: script.lr_av_nav_up
- key: DOWN
  service: script.lr_av_nav_down
- key: LEFT
  service: script.lr_av_nav_left
- key: RIGHT
  service: script.lr_av_nav_right
- key: CENTER
  service: script.lr_av_nav_select
- key: BACK
  service: script.lr_av_nav_back
- key: HOME
  service: script.lr_av_nav_home
- key: VOLUME_UP
  service: script.lr_sonos_volume_up
- key: VOLUME_DOWN
  service: script.lr_sonos_volume_down
- key: MUTE
  service: script.lr_sonos_mute_toggle
- key: PAGE_UP
  service: script.lr_av_channel_up
- key: PAGE_DOWN
  service: script.lr_av_channel_down
- key: LIGHT
  page: Living Room
  scroll_to: Lights
- key: CURTAIN
  page: Living Room
  scroll_to: Shades
- key: SCENE
  page: Living Room
  scroll_to: Watch
- key: AC
  page: Living Room
  scroll_to: Climate
- key: MENU
  service: script.lr_av_menu
- key: CUSTOM_1
  service: script.lr_av_watch_apple_tv
- key: CUSTOM_2
  service: script.lr_av_watch_kaleidescape
- key: CUSTOM_3
  service: script.lr_av_play_switch
- key: CUSTOM_4
  service: script.lr_av_off
# The physical Off button reports keycode 132 (POWER). Without a binding the app
# just toasts "Unmapped key: 132".
- key: POWER
  service: script.lr_av_off
# Press and talk; it ends itself on ~1.2 s of silence (and gives up after 4 s if
# you never speak). The remote makes NO routing decision - it streams the mic to
# /api/hap_remote/audio and HA sends it to Siri on the Apple TV or to Assist,
# depending on the AV activity.
- key: VOICE
  action: voice
# No longHotkeys. CENTER used to carry script.lr_av_play_pause on a long press,
# which was a SECOND play/pause toggle on the same key -- `select`, the short
# press, already toggles playback. Verified on the Kaleidescape: two `select`
# commands five seconds apart took a paused film to playing and back to paused.
# (The Apple TV is the same by tvOS convention -- OK pauses during playback --
# but that was not measured here.)
#
# A press held long enough to trip both bindings therefore toggled TWICE and
# cancelled out, which is why the first press of a session appeared to do nothing
# and needed a second one.
#
# This was script.lr_av_play_pause's last caller, so it is now unreferenced. Kept
# anyway: it routes a toggle to whichever source is active, which is a useful
# thing to have for an automation or a webhook. Delete it if that never happens.
