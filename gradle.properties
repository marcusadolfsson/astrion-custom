org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Bounded so the Compose build fits a small/CI machine without OOM-killing the
# Kotlin daemon. Raise these if you build on a workstation with RAM to spare.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
